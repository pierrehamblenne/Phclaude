<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Calcul Mental !</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        h1 {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }

        .stars {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        /* --- Ecran d'accueil --- */
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #menu h1 {
            font-size: 2.2em;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #777;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .difficulty-section {
            width: 100%;
            margin: 10px 0;
        }

        .difficulty-section label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .diff-btn {
            padding: 12px 20px;
            border: 3px solid #ddd;
            border-radius: 15px;
            background: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .diff-btn:hover {
            transform: scale(1.05);
        }

        .diff-btn.selected {
            border-color: #764ba2;
            background: #f3e8ff;
            color: #764ba2;
        }

        .diff-btn.easy { color: #27ae60; }
        .diff-btn.easy.selected { border-color: #27ae60; background: #e8f8f0; }
        .diff-btn.medium { color: #f39c12; }
        .diff-btn.medium.selected { border-color: #f39c12; background: #fef9e7; }
        .diff-btn.hard { color: #e74c3c; }
        .diff-btn.hard.selected { border-color: #e74c3c; background: #fdedec; }

        .start-btn {
            padding: 18px 50px;
            font-size: 1.4em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        /* --- Ecran de jeu --- */
        #game {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .score-display {
            font-size: 1.3em;
            font-weight: bold;
            color: #764ba2;
        }

        .timer-display {
            font-size: 1.3em;
            font-weight: bold;
            color: #e74c3c;
            background: #fdedec;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .streak-display {
            font-size: 0.9em;
            color: #f39c12;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .question-number {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .question {
            font-size: 3em;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question .operator {
            color: #764ba2;
            margin: 0 10px;
        }

        .answer-input {
            font-size: 2em;
            text-align: center;
            padding: 15px;
            border: 4px solid #ddd;
            border-radius: 20px;
            width: 200px;
            outline: none;
            transition: border-color 0.3s;
            font-weight: bold;
            color: #333;
        }

        .answer-input:focus {
            border-color: #764ba2;
        }

        .answer-input.correct {
            border-color: #27ae60;
            background: #e8f8f0;
            animation: pulse 0.5s;
        }

        .answer-input.wrong {
            border-color: #e74c3c;
            background: #fdedec;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .validate-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .validate-btn:hover {
            transform: scale(1.05);
        }

        .feedback {
            margin-top: 15px;
            font-size: 1.3em;
            font-weight: bold;
            min-height: 40px;
        }

        .feedback.correct {
            color: #27ae60;
        }

        .feedback.wrong {
            color: #e74c3c;
        }

        /* --- Ecran de résultat --- */
        #results {
            display: none;
        }

        .result-title {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0;
        }

        .result-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
        }

        .result-card .label {
            font-size: 0.9em;
            color: #777;
        }

        .result-card .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .medal {
            font-size: 4em;
            margin: 10px 0;
        }

        .message {
            font-size: 1.1em;
            color: #555;
            margin: 10px 0 20px;
        }

        .replay-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .replay-btn:hover {
            transform: scale(1.05);
        }

        .home-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: #764ba2;
            background: white;
            border: 3px solid #764ba2;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .home-btn:hover {
            transform: scale(1.05);
        }

        /* --- Confettis --- */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* --- Etoiles flottantes --- */
        .floating-star {
            position: fixed;
            font-size: 1.5em;
            animation: floatUp 1.5s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container {
                padding: 25px;
                border-radius: 20px;
            }
            .question {
                font-size: 2.2em;
            }
            .answer-input {
                font-size: 1.5em;
                width: 150px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- MENU -->
    <div id="menu">
        <h1>Challenge Calcul !</h1>
        <div class="subtitle">Deviens un champion du calcul mental</div>

        <div class="difficulty-section">
            <label>Choisis ton niveau :</label>
            <div class="difficulty-buttons">
                <button class="diff-btn easy selected" onclick="selectDifficulty('easy', this)">
                    Facile
                </button>
                <button class="diff-btn medium" onclick="selectDifficulty('medium', this)">
                    Moyen
                </button>
                <button class="diff-btn hard" onclick="selectDifficulty('hard', this)">
                    Difficile
                </button>
            </div>
        </div>

        <div class="difficulty-section">
            <label>Type de calcul :</label>
            <div class="difficulty-buttons">
                <button class="diff-btn selected" data-type="mixed" onclick="selectType('mixed', this)">
                    Mix
                </button>
                <button class="diff-btn" data-type="addition" onclick="selectType('addition', this)">
                    + Addition
                </button>
                <button class="diff-btn" data-type="subtraction" onclick="selectType('subtraction', this)">
                    - Soustraction
                </button>
                <button class="diff-btn" data-type="multiplication" onclick="selectType('multiplication', this)">
                    x Tables
                </button>
            </div>
        </div>

        <button class="start-btn" onclick="startGame()">C'est parti !</button>
    </div>

    <!-- JEU -->
    <div id="game">
        <div class="top-bar">
            <div class="score-display">Score : <span id="score">0</span></div>
            <div class="streak-display" id="streak"></div>
            <div class="timer-display" id="timer">60s</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="question-number" id="questionNum">Question 1 / 10</div>
        <div class="question" id="question"></div>
        <input type="number" class="answer-input" id="answer" autocomplete="off" inputmode="numeric">
        <br>
        <button class="validate-btn" onclick="checkAnswer()">Valider</button>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- RESULTATS -->
    <div id="results">
        <div class="medal" id="medal"></div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-score" id="finalScore"></div>
        <div class="result-details">
            <div class="result-card">
                <div class="label">Bonnes reponses</div>
                <div class="value" id="correctCount"></div>
            </div>
            <div class="result-card">
                <div class="label">Meilleure serie</div>
                <div class="value" id="bestStreak"></div>
            </div>
            <div class="result-card">
                <div class="label">Temps moyen</div>
                <div class="value" id="avgTime"></div>
            </div>
            <div class="result-card">
                <div class="label">Precision</div>
                <div class="value" id="accuracy"></div>
            </div>
        </div>
        <div class="message" id="resultMessage"></div>
        <button class="replay-btn" onclick="startGame()">Rejouer</button>
        <button class="home-btn" onclick="goHome()">Accueil</button>
    </div>

</div>

<script>
    // --- Configuration ---
    const TOTAL_QUESTIONS = 10;
    const TIME_LIMIT = 60;

    let difficulty = 'easy';
    let calcType = 'mixed';
    let currentQuestion = 0;
    let score = 0;
    let correctAnswers = 0;
    let currentAnswer = 0;
    let streak = 0;
    let bestStreak = 0;
    let timeLeft = TIME_LIMIT;
    let timerInterval = null;
    let questionStartTime = 0;
    let totalAnswerTime = 0;

    const encouragements = [
        "Super !", "Bravo !", "Genial !", "Excellent !", "Trop fort !",
        "Champion !", "Magnifique !", "Parfait !", "Wow !", "Incroyable !"
    ];

    const wrongMessages = [
        "Presque !", "Pas tout a fait...", "Essaie encore !", "Courage !",
        "Tu vas y arriver !"
    ];

    // --- Selection difficulte et type ---
    function selectDifficulty(diff, btn) {
        difficulty = diff;
        document.querySelectorAll('.difficulty-section:first-of-type .diff-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function selectType(type, btn) {
        calcType = type;
        document.querySelectorAll('.difficulty-section:last-of-type .diff-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    // --- Generation de questions ---
    function generateQuestion() {
        let a, b, operator, answer;
        const types = calcType === 'mixed'
            ? ['addition', 'subtraction', 'multiplication']
            : [calcType];
        const type = types[Math.floor(Math.random() * types.length)];

        switch (difficulty) {
            case 'easy':
                if (type === 'addition') {
                    a = rand(1, 10);
                    b = rand(1, 10);
                    operator = '+';
                    answer = a + b;
                } else if (type === 'subtraction') {
                    a = rand(3, 15);
                    b = rand(1, a);
                    operator = '-';
                    answer = a - b;
                } else {
                    a = rand(1, 5);
                    b = rand(1, 5);
                    operator = 'x';
                    answer = a * b;
                }
                break;

            case 'medium':
                if (type === 'addition') {
                    a = rand(10, 50);
                    b = rand(5, 30);
                    operator = '+';
                    answer = a + b;
                } else if (type === 'subtraction') {
                    a = rand(20, 60);
                    b = rand(5, a);
                    operator = '-';
                    answer = a - b;
                } else {
                    a = rand(2, 9);
                    b = rand(2, 9);
                    operator = 'x';
                    answer = a * b;
                }
                break;

            case 'hard':
                if (type === 'addition') {
                    a = rand(20, 100);
                    b = rand(10, 80);
                    operator = '+';
                    answer = a + b;
                } else if (type === 'subtraction') {
                    a = rand(30, 100);
                    b = rand(10, a);
                    operator = '-';
                    answer = a - b;
                } else {
                    a = rand(3, 12);
                    b = rand(3, 12);
                    operator = 'x';
                    answer = a * b;
                }
                break;
        }

        return { a, b, operator, answer };
    }

    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // --- Demarrage du jeu ---
    function startGame() {
        currentQuestion = 0;
        score = 0;
        correctAnswers = 0;
        streak = 0;
        bestStreak = 0;
        timeLeft = TIME_LIMIT;
        totalAnswerTime = 0;

        document.getElementById('menu').style.display = 'none';
        document.getElementById('results').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        document.getElementById('score').textContent = '0';
        document.getElementById('streak').textContent = '';

        startTimer();
        nextQuestion();
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const el = document.getElementById('timer');
        el.textContent = timeLeft + 's';
        if (timeLeft <= 10) {
            el.style.color = '#e74c3c';
            el.style.animation = 'pulse 0.5s infinite';
        } else {
            el.style.color = '#e74c3c';
            el.style.animation = '';
        }
    }

    // --- Question suivante ---
    function nextQuestion() {
        if (currentQuestion >= TOTAL_QUESTIONS) {
            endGame();
            return;
        }

        currentQuestion++;
        const q = generateQuestion();
        currentAnswer = q.answer;

        document.getElementById('questionNum').textContent = `Question ${currentQuestion} / ${TOTAL_QUESTIONS}`;
        document.getElementById('question').innerHTML =
            `${q.a} <span class="operator">${q.operator}</span> ${q.b} <span class="operator">=</span> ?`;
        document.getElementById('progress').style.width = ((currentQuestion - 1) / TOTAL_QUESTIONS * 100) + '%';

        const input = document.getElementById('answer');
        input.value = '';
        input.className = 'answer-input';
        input.focus();

        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = 'feedback';

        questionStartTime = Date.now();
    }

    // --- Verification de la reponse ---
    function checkAnswer() {
        const input = document.getElementById('answer');
        const userAnswer = parseInt(input.value);
        const feedback = document.getElementById('feedback');

        if (isNaN(userAnswer)) {
            input.classList.add('wrong');
            setTimeout(() => input.classList.remove('wrong'), 500);
            return;
        }

        const answerTime = (Date.now() - questionStartTime) / 1000;
        totalAnswerTime += answerTime;

        if (userAnswer === currentAnswer) {
            // Bonne reponse !
            correctAnswers++;
            streak++;
            if (streak > bestStreak) bestStreak = streak;

            // Bonus de points selon la vitesse
            let points = 10;
            if (answerTime < 3) points = 20;
            else if (answerTime < 5) points = 15;

            // Bonus de serie
            if (streak >= 3) points += streak * 2;

            score += points;
            document.getElementById('score').textContent = score;

            input.classList.add('correct');
            feedback.textContent = encouragements[Math.floor(Math.random() * encouragements.length)];
            if (streak >= 3) {
                feedback.textContent += ` Serie de ${streak} !`;
            }
            feedback.className = 'feedback correct';

            document.getElementById('streak').textContent = streak >= 2 ? `Serie : ${streak}` : '';

            spawnFloatingStar(input);

        } else {
            // Mauvaise reponse
            streak = 0;
            input.classList.add('wrong');
            feedback.textContent = `${wrongMessages[Math.floor(Math.random() * wrongMessages.length)]} C'etait ${currentAnswer}`;
            feedback.className = 'feedback wrong';
            document.getElementById('streak').textContent = '';
        }

        // Passer a la question suivante apres un delai
        setTimeout(() => {
            nextQuestion();
        }, 1200);
    }

    // --- Etoile flottante ---
    function spawnFloatingStar(element) {
        const star = document.createElement('div');
        star.className = 'floating-star';
        star.textContent = ['⭐', '🌟', '✨'][Math.floor(Math.random() * 3)];
        const rect = element.getBoundingClientRect();
        star.style.left = (rect.left + rect.width / 2) + 'px';
        star.style.top = rect.top + 'px';
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 1500);
    }

    // --- Fin du jeu ---
    function endGame() {
        clearInterval(timerInterval);

        document.getElementById('game').style.display = 'none';
        document.getElementById('results').style.display = 'block';

        const accuracy = Math.round((correctAnswers / currentQuestion) * 100) || 0;
        const avgTime = currentQuestion > 0 ? (totalAnswerTime / currentQuestion).toFixed(1) : 0;

        document.getElementById('finalScore').textContent = score + ' points';
        document.getElementById('correctCount').textContent = correctAnswers + ' / ' + currentQuestion;
        document.getElementById('bestStreak').textContent = bestStreak + ' 🔥';
        document.getElementById('avgTime').textContent = avgTime + 's';
        document.getElementById('accuracy').textContent = accuracy + '%';

        let medal, title, message;
        if (accuracy >= 90) {
            medal = '🏆';
            title = 'Champion !';
            message = 'Tu es un vrai genie du calcul !';
            launchConfetti();
        } else if (accuracy >= 70) {
            medal = '🥈';
            title = 'Tres bien !';
            message = 'Continue comme ca, tu progresses super bien !';
            launchConfetti();
        } else if (accuracy >= 50) {
            medal = '🥉';
            title = 'Pas mal !';
            message = 'Avec un peu d\'entrainement, tu seras encore meilleur !';
        } else {
            medal = '💪';
            title = 'Courage !';
            message = 'C\'est en s\'entrainant qu\'on devient fort ! Rejoue !';
        }

        document.getElementById('medal').textContent = medal;
        document.getElementById('resultTitle').textContent = title;
        document.getElementById('resultMessage').textContent = message;
    }

    // --- Confettis ---
    function launchConfetti() {
        const colors = ['#f093fb', '#f5576c', '#667eea', '#764ba2', '#ffd700', '#27ae60', '#3498db'];
        for (let i = 0; i < 50; i++) {
            setTimeout(() => {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 8 + 5) + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = '0s';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }, i * 50);
        }
    }

    // --- Retour accueil ---
    function goHome() {
        document.getElementById('results').style.display = 'none';
        document.getElementById('game').style.display = 'none';
        document.getElementById('menu').style.display = 'flex';
    }

    // --- Entree clavier ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.getElementById('game').style.display === 'block') {
            checkAnswer();
        }
    });
</script>

</body>
</html>
